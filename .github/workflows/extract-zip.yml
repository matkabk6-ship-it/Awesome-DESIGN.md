name: Extract ZIP
on:
  push:
    branches: [main]
jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          rm -rf /tmp/extract
          mkdir -p /tmp/extract
          unzip -q awesome-design-md-main.zip -d /tmp/extract
          SRC=/tmp/extract
          if [ -d /tmp/extract/awesome-design-md-main ]; then SRC=/tmp/extract/awesome-design-md-main; fi
          cp -a "$SRC"/. .
          rm -rf .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract awesome-design-md-main.zip" || exit 0
          git push
